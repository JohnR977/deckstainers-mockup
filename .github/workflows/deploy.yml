# Rebuilds and publishes the website every time someone saves a change on GitHub
# (for example, editing partners/chattanooga/site.config.json or uploading a photo).
# If the config has a mistake, this run turns red and the log explains what to fix.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the config files for mistakes
        run: node src/check.mjs
      - name: Build the websites (into a fresh folder, so old files never linger)
        run: |
          node src/build.mjs partners/chattanooga _site
          node src/build.mjs partners/knoxville _site/demo-knoxville
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
